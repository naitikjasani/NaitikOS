packages:
  - 'apps/*'
  - 'packages/*'

# pnpm blocks dependency lifecycle scripts by default. Only these may run, and
# each is here deliberately — an unreviewed postinstall script is arbitrary code
# execution against a machine holding medical data (blueprint §5.14).
#
# `esbuild` downloads a platform binary in postinstall; tsx and vitest are
# unusable without it. `sharp` does the same for libvips, and is listed ahead of
# the media pipeline (§5.5) that will need it.
#
# Note for future edits: this key was `onlyBuiltDependencies` (a list) before
# pnpm 11 renamed it to `allowBuilds` (a map). The old key is silently ignored
# rather than rejected, so a stale one looks correct and does nothing.
allowBuilds:
  esbuild: true
  sharp: true
  # Native module resolver behind eslint-config-next's import plugin. Build-time
  # only — it never ships to the browser and never runs in production. Without
  # it, `eslint .` cannot resolve a path alias and the boundary rules (§5.0)
  # silently stop catching violations, which is worse than the build script.
  unrs-resolver: true

# Single source of truth for dependency versions across every workspace package.
# Blueprint §6.2: "configuration duplicated across packages drifts; configuration
# in a package does not." The same reasoning applies to versions — one bump here
# updates every consumer, so React can never be two versions in two packages.
catalog:
  # --- Runtime: UI -----------------------------------------------------------
  next: 16.2.12
  react: 19.2.8
  react-dom: 19.2.8
  '@types/react': 19.2.7
  '@types/react-dom': 19.2.4

  # --- Runtime: state --------------------------------------------------------
  '@tanstack/react-query': 5.101.4
  '@tanstack/react-query-devtools': 5.101.4
  zustand: 5.0.14

  # --- Runtime: data ---------------------------------------------------------
  drizzle-orm: 0.45.2
  postgres: 3.4.9
  '@supabase/supabase-js': 2.111.0

  # Cookie-based session handling for the App Router. Separate package from
  # supabase-js because the cookie plumbing differs per framework; §5.4's
  # "no client-direct-to-database access" means this is used for auth only.
  '@supabase/ssr': 0.12.4

  # drizzle-kit is build-time only (generate/migrate/studio), but its version is
  # coupled to drizzle-orm's — a mismatch produces migrations the runtime cannot
  # read. Catalogued next to its runtime pair so the two are bumped together.
  drizzle-kit: 0.31.10

  # --- Runtime: validation ---------------------------------------------------
  zod: 4.4.3

  # --- Runtime: UI primitives ------------------------------------------------
  # shadcn/ui is vendored as source (blueprint §5.1) — these are its
  # underlying runtime dependencies, which remain real packages.
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  tailwind-merge: 3.4.1
  lucide-react: 0.552.0

  # --- Build / tooling -------------------------------------------------------
  typescript: 6.0.3 # pinned <6.1.0 — see docs/adr/0002
  tailwindcss: 4.3.3
  '@tailwindcss/postcss': 4.3.3
  turbo: 2.10.8
  vitest: 4.1.10
  '@vitejs/plugin-react': 5.1.1

  # --- Lint / format ---------------------------------------------------------
  eslint: 10.8.0
  '@eslint/js': 10.0.1
  typescript-eslint: 8.65.0
  eslint-plugin-boundaries: 7.1.0
  eslint-config-next: 16.2.12
  eslint-config-prettier: 10.1.8
  eslint-plugin-react-hooks: 7.1.1
  globals: 16.5.0
  prettier: 3.9.6
  prettier-plugin-tailwindcss: 0.7.1

  # --- Git hooks -------------------------------------------------------------
  husky: 9.1.7
  lint-staged: 17.3.0

  # --- Node ------------------------------------------------------------------
  '@types/node': 24.10.1
  tsx: 4.21.1
